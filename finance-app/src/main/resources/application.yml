server:
  port: 18080
  servlet:
    context-path: /api

spring:
  application:
    name: finance-app
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/finance_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.finance.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志默认关闭，避免生产环境泄露业务数据；排查问题时可设为 StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: ""

# JWT 配置
jwt:
  # 生产环境必须通过 JWT_SECRET 注入，长度不少于 32 字节
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-production}
  expire: 86400  # 单位：秒，24小时
  header: Authorization
  prefix: "Bearer "

# 文件上传路径
file:
  upload-path: ./data/files/
  access-prefix: /api/file/

# 日志配置
logging:
  level:
    # 默认 info；本地排查可用 LOG_LEVEL=debug 覆盖
    com.finance: ${LOG_LEVEL:info}
    com.baomidou.mybatisplus: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# Knife4j
knife4j:
  # 生产环境务必置为 false，否则接口文档可被匿名访问
  enable: ${KNIFE4J_ENABLE:false}
  production: ${KNIFE4J_PRODUCTION:true}
  setting:
    language: zh_cn
    enable-version: false
    enable-swagger-models: true
    swagger-model-name: 实体类列表
